<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f4f8;
        --surface: #ffffff;
        --text: #14161a;
        --muted: #62697b;
        --accent: #6366f1;
        --accent-dark: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f13;
          --surface: #17181f;
          --text: #f2f3f7;
          --muted: #9297a8;
          --accent: #818cf8;
          --accent-dark: #a5b0fb;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .hero {
        position: relative;
        width: 100%;
        aspect-ratio: 21 / 9;
        max-height: 480px;
        min-height: 220px;
        overflow: hidden;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        display: flex;
        align-items: flex-end;
      }
      .hero.no-image {
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .hero img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .hero-overlay {
        position: relative;
        z-index: 1;
        width: 100%;
        padding: 3rem 1.5rem 2.5rem;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.65), transparent);
      }
      .hero.no-image .hero-overlay {
        background: none;
        padding: 3rem 1.5rem;
      }
      .hero h1 {
        margin: 0 auto;
        max-width: 760px;
        color: #fff;
        font-size: clamp(1.75rem, 4vw, 2.75rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      main {
        max-width: 720px;
        margin: -3rem auto 0;
        position: relative;
        z-index: 2;
        padding: 0 1.25rem 4rem;
      }
      .card {
        background: var(--surface);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.14);
      }
      .meta {
        margin: 0 0 1.1rem;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .description {
        margin: 0;
        font-size: 1.05rem;
        line-height: 1.75;
        color: var(--text);
        white-space: pre-wrap;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1.75rem;
        padding: 0.75rem 1.6rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
      }
      footer {
        text-align: center;
        padding: 2rem 1rem;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="hero{{heroClass}}">
      {{imageTag}}
      <div class="hero-overlay">
        <h1>{{title}}</h1>
      </div>
    </div>
    <main>
      <article class="card">
        <p class="meta">Published {{publishedDate}}</p>
        <p class="description">{{description}}</p>
        {{ctaBlock}}
      </article>
    </main>
    <footer>Published with Post Manager</footer>
  </body>
</html>
